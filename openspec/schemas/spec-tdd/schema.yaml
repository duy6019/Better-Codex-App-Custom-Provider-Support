name: spec-tdd
version: 1
description: >
  Two-tier spec-driven workflow with superpowers TDD.
  LIGHT tier (default): proposal + delta specs, then implement with
  superpowers:test-driven-development in-session. The apply gate is [specs], so
  /opsx:propose stops after two artifacts.
  HEAVY tier: additionally design + tasks + <change-name>-plan.md written by
  superpowers:writing-plans, executed by superpowers:subagent-driven-development.
  Requires the superpowers plugin. Every change closes with `openspec archive`,
  which merges the delta into openspec/specs/.
artifacts:
  - id: proposal
    generates: proposal.md
    description: Initial proposal document outlining the change
    template: proposal.md
    instruction: >
      Create the proposal document that establishes WHY this change is needed.


      Sections:

      - **Why**: 1-2 sentences on the problem or opportunity. What problem does
      this solve? Why now?

      - **What Changes**: Bullet list of changes. Be specific about new
      capabilities, modifications, or removals. Mark breaking changes with
      **BREAKING**.

      - **Capabilities**: Identify which specs will be created or modified:
        - **New Capabilities**: List capabilities being introduced. Each becomes a new `specs/<name>/spec.md`. Use kebab-case names (e.g., `user-auth`, `data-export`).
        - **Modified Capabilities**: List existing capabilities whose REQUIREMENTS are changing. Only include if spec-level behavior changes (not just implementation details). Each needs a delta spec file. Check `openspec/specs/` for existing spec names. Leave empty if no requirement changes.
      - **Impact**: Affected code, APIs, dependencies, or systems.


      IMPORTANT: The Capabilities section is critical. It creates the contract
      between

      proposal and specs phases. Research existing specs before filling this in.

      Each capability listed here will need a corresponding spec file.


      Keep it concise (1-2 pages). Focus on the "why" not the "how" -

      implementation details belong in design.md.


      This is the foundation - specs, design, and tasks all build on this.
    requires: []
  - id: specs
    generates: specs/**/*.md
    description: Detailed specifications for the change
    template: spec.md
    instruction: >
      Create specification files that define WHAT the system should do.


      Create one spec file per capability listed in the proposal's Capabilities
      section.

      - New capabilities: use the exact kebab-case name from the proposal
      (specs/<capability>/spec.md).

      - Modified capabilities: use the existing spec folder name from
      openspec/specs/<capability>/ when creating the delta spec at
      specs/<capability>/spec.md.


      Delta operations (use ## headers):

      - **ADDED Requirements**: New capabilities

      - **MODIFIED Requirements**: Changed behavior - MUST include full updated
      content

      - **REMOVED Requirements**: Deprecated features - MUST include **Reason**
      and **Migration**

      - **RENAMED Requirements**: Name changes only - use FROM:/TO: format


      Format requirements:

      - Each requirement: `### Requirement: <name>` followed by description

      - Use SHALL/MUST for normative requirements (avoid should/may)

      - Each scenario: `#### Scenario: <name>` with WHEN/THEN format

      - **CRITICAL**: Scenarios MUST use exactly 4 hashtags (`####`). Using 3
      hashtags or bullets will fail silently.

      - Every requirement MUST have at least one scenario.


      MODIFIED requirements workflow:

      1. Locate the existing requirement in openspec/specs/<capability>/spec.md

      2. Copy the ENTIRE requirement block (from `### Requirement:` through all
      scenarios)

      3. Paste under `## MODIFIED Requirements` and edit to reflect new behavior

      4. Ensure header text matches exactly (whitespace-insensitive)


      Common pitfall: Using MODIFIED with partial content loses detail at
      archive time.

      If adding new concerns without changing existing behavior, use ADDED
      instead.


      Example:

      ```

      ## ADDED Requirements


      ### Requirement: User can export data

      The system SHALL allow users to export their data in CSV format.


      #### Scenario: Successful export

      - **WHEN** user clicks "Export" button

      - **THEN** system downloads a CSV file with all user data


      ## REMOVED Requirements


      ### Requirement: Legacy export

      **Reason**: Replaced by new export system

      **Migration**: Use new export endpoint at /api/v2/export

      ```


      Specs should be testable - each scenario is a potential test case.
    requires:
      - proposal
  - id: design
    generates: design.md
    description: Technical design document with implementation details
    template: design.md
    instruction: >
      Create the design document that explains HOW to implement the change.


      When to include design.md (create only if any apply):

      - Cross-cutting change (multiple services/modules) or new architectural
      pattern

      - New external dependency or significant data model changes

      - Security, performance, or migration complexity

      - Ambiguity that benefits from technical decisions before coding


      Sections:

      - **Context**: Background, current state, constraints, stakeholders

      - **Goals / Non-Goals**: What this design achieves and explicitly excludes

      - **Decisions**: Key technical choices with rationale (why X over Y?).
      Include alternatives considered for each decision.

      - **Risks / Trade-offs**: Known limitations, things that could go wrong.
      Format: [Risk] → Mitigation

      - **Migration Plan**: Steps to deploy, rollback strategy (if applicable)

      - **Open Questions**: Outstanding decisions or unknowns to resolve


      Focus on architecture and approach, not line-by-line implementation.

      Reference the proposal for motivation and specs for requirements.


      Good design docs explain the "why" behind technical decisions.
    requires:
      - specs
  - id: tasks
    generates: tasks.md
    description: Implementation checklist with trackable tasks
    template: tasks.md
    instruction: >
      Create the task list that breaks down the implementation work.


      **IMPORTANT: Follow the template below exactly.** The apply phase parses

      checkbox format to track progress. Tasks not using `- [ ]` won't be
      tracked.


      Guidelines:

      - Group related tasks under ## numbered headings

      - Each task MUST be a checkbox: `- [ ] X.Y Task description`

      - Tasks should be small enough to complete in one session

      - Order tasks by dependency (what must be done first?)


      Example:

      ```

      ## 1. Setup


      - [ ] 1.1 Create new module structure

      - [ ] 1.2 Add dependencies to package.json


      ## 2. Core Implementation


      - [ ] 2.1 Implement data export function

      - [ ] 2.2 Add CSV formatting utilities

      ```


      Reference specs for what needs to be built, design for how to build it.

      Each task should be verifiable - you know when it's done.
    requires:
      - specs
  - id: plan
    generates: "*-plan.md"
    description: TDD micro-step implementation plan (superpowers writing-plans)
    template: plan.md
    instruction: |
      PRECHECK: confirm `superpowers:writing-plans` appears in your available
      skills list. If it is missing, STOP and tell the user. Do NOT silently
      fall back to writing the plan yourself.

      Use the Skill tool to invoke **superpowers:writing-plans**.

      OUTPUT REDIRECTION (required):
      - Do NOT write to `docs/superpowers/plans/`. Write the plan directly into
        this change directory as `<change-name>-plan.md`.
      - The filename MUST be change-unique. superpowers' sdd-workspace derives
        its scratch directory from `basename <plan> .md`; a plan named plan.md
        makes every change share one workspace and overwrite each other's
        ledgers.
      - Ignore the skill's "Execution Handoff" menu at the end. This schema's
        apply phase decides the executor, not that menu.

      FORMAT IS A MACHINE CONTRACT, not a style preference:
      - Task headings MUST be `## Task N: <name>`. superpowers' task-brief awk
        matches `^#+[ \t]+Task[ \t]+[0-9]+`; any other heading makes it exit 3.
      - Every checkbox MUST start at column 0. OpenSpec's checkbox regexes
        anchor `^` directly to `[-*]`, so indented checkboxes are invisible.

      Read tasks.md for the coarse breakdown and specs/ for required behavior.
      Every task must carry the explicit cycle: write the failing test, run it
      and watch it fail, minimal implementation, run it and watch it pass,
      commit.
    requires:
      - tasks
apply:
  requires:
    - specs
  tracks: null
  instruction: |
    STOP. Do not start writing implementation code directly.

    This project runs two tiers. Work out which one applies, then follow it.

    ## Which tier

    LIGHT (the default): the change touches one module, adds no dependency,
    needs no data migration, and does not alter an external contract.
    HEAVY: anything else, or the user explicitly asked for it.

    Mechanical test: if there is no tasks.md in this change directory, you are
    in LIGHT tier. Do not create one to get out of it.

    ## LIGHT tier

    1. Use the Skill tool to invoke `superpowers:test-driven-development`.
       If that skill is not in your available skills list, STOP and tell the
       user. Do NOT implement without it.
    2. Implement in the current session. No worktree, no plan file, no subagents.
    3. The Iron Law governs every line of production code you write:
       "NO PRODUCTION CODE WITHOUT A FAILING TEST FIRST."
       Write the test, run it, watch it fail for the right reason, then implement.

    ## LIGHT tier — legacy code carve-out

    Your human partner has granted the following standing exception, which
    satisfies test-driven-development's own "No exceptions without your human
    partner's permission" clause. Follow it as compliance, not as an override.

    Declare each test's KIND before you run it:
    - A SPEC TEST drives new or changed behavior and MUST fail first. Passing
      immediately means the test is defective — fix the test.
    - A CHARACTERIZATION TEST pins behavior that already exists and MUST pass
      first. Passing immediately is its SUCCESS CONDITION, never a red flag.
      The Iron Law governs production-code emission; writing a characterization
      test emits no production code, so it does not trigger the Iron Law.
      Verify it by deliberately breaking the production code, watching the test
      fail, then reverting the break.

    You may NOT reclassify a spec test as a characterization test after seeing
    it pass. Characterization tests live under `tests/characterization/` so the
    declaration is auditable in the diff, and they are committed BEFORE the
    production change they protect.

    Bug fixes need no carve-out: a test reproducing a bug asserts correct
    behavior and therefore fails honestly. That is a genuine RED.

    ## HEAVY tier

    1. Commit the change artifacts first:
       `git add openspec/changes/<name>/ && git commit`
       Nothing in superpowers 6.2.0 carries untracked files into a worktree.
       Skip this and the executor reads a plan that is not there.
    2. Worktrees are OPTIONAL and off by default on this solo project. Invoke
       `superpowers:using-git-worktrees` only if the user asks for one.
    3. Use the Skill tool to invoke `superpowers:subagent-driven-development`,
       pointed at `<change-name>-plan.md`.
    4. REQUIRED — do not skip, and do not assume it happens by itself:
       subagent-driven-development does NOT activate test-driven-development in
       superpowers 6.2.0. Its implementer prompt only says "Write tests
       (following TDD if task says to)". So you MUST state in every dispatch
       that the task is TDD-required.
    5. Tick the tasks.md checkboxes as coarse tasks complete. No superpowers
       skill does this for you.
    6. When you dispatch the final whole-branch review, include the paths of
       every file under this change's `specs/` and require a
       requirement-by-requirement conformance check against the diff.

    ## Both tiers — closing

    Before archiving, re-read this change's `specs/` delta. If what you built
    differs from any scenario, edit the delta spec to describe what was actually
    built, and say in chat which scenarios you changed and why. A delta spec
    that does not match the merged code is a defect, not a plan.

    Close with the CLI: `openspec archive <change-name>`. It is a deterministic
    parser with a scenario-drop guard. Do NOT use /opsx:sync — that path is an
    agent-driven freehand merge with no such guard.

    Archive BEFORE invoking `superpowers:finishing-a-development-branch`, so the
    synced spec lands in the same diff.
